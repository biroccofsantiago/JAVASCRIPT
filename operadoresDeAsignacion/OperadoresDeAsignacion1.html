<html>
<body>
  <script>
    var a = 10;
    var b = 5;
    a += b;
    document.write('a += b => ' + a + '<br>');
    a -= b;
    document.write('a -= b => ' + a + '<br>');
    a *= b;
    document.write('a *= b => ' + a + '<br>');
    a /= b;
    document.write('a /= b => ' + a);
  </script>
</body>
</html>
