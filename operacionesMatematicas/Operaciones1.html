<html>
<body>
  <script>
    var a = 10;
    var b = 5;
    var c = 2;
    document.write('a + b = ' + (a + b) + '<br>');
    document.write('a - b = ' + (a - b) + '<br>');
    document.write('a * b = ' + (a * b) + '<br>');
    document.write('a / b = ' + (a / b) + '<br>');
    document.write('a % b = ' + (a % b) + '<br>');
    document.write('a + b + c = ' + (a + b + c));
  </script>
</body>
</html>
